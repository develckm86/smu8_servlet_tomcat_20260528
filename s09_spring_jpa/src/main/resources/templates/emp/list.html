<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>사원 리스트</title>
</head>
<body>
  <h1>사원 리스트</h1>

    <h2> 부서 리스트</h2>
  <ul>
      <li th:each="d : ${depts}">
          부서번호 : <b th:text="${d.id}"></b>
          부서이름 : <b th:text="${d.dname}"></b>
          부서위치 : <b th:text="${d.loc}"></b>
      </li>
  </ul>
</body>
</html>
